name: Publish to Comfy registry
on:
  workflow_dispatch: # Позволяет запускать публикацию вручную со страницы GitHub
  push:
    branches:
      - main # Если ваша главная ветка называется master, замените main на master
    paths:
      - "pyproject.toml" # Action сработает только если вы измените этот файл

jobs:
  publish-node:
    name: Publish Custom Node to registry
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v7
      - name: Publish Custom Node
        uses: Comfy-Org/publish-node-action@main
        with:
          personal_access_token: ${{ secrets.REGISTRY_ACCESS_TOKEN }}
